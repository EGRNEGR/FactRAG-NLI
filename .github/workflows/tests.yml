name: tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    # Unit tests use development fallbacks only: no model weights, no GPU, no llama-server.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[web,documents,retrieval,audit,dev]" httpx==0.28.1 "transformers>=4.40"
      - name: Unit tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy --strict .
